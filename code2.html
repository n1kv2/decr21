<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>EN?DECR2nik1v nd flr</title>

    <script>
        window.addEventListener('load', () => {
            const isUnlocked = sessionStorage.getItem('isUnlocked');
            if (isUnlocked !== 'true') {
                window.location.href = "index.html";
            }
        });
    </script>
</head>

<style>
body {
    font-family: 'Montserrat', sans-serif;
    background-color: #f0f2f5; 
    color: #333;
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px 0; 
    box-sizing: border-box;
}

.container {
    background-color: #ffffff;
    padding: 40px;
    border-radius: 15px; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
    width: 90%;
    max-width: 500px; 
    text-align: left; 
    margin-bottom: 20px; 
}

h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    text-align: center;
    margin-top: 0;
    margin-bottom: 30px;
    color: #222;
    font-size: 2.2em;
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600; 
    font-size: 1.05em;
    color: #444;
}

textarea, 
input[type="text"], 
select {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 8px; 
    font-size: 1.05em;
    font-family: 'Roboto Mono', monospace; 
    color: #333;
    background-color: #fff;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box; 
}

textarea {
    resize: none;
    min-height: 120px; 
}

textarea:focus, 
input[type="text"]:focus, 
select:focus {
    border-color: #000; 
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05), 0 0 0 3px rgba(0,0,0,0.1);
    outline: none;
}

button[onclick="processText()"] {
    width: 100%;
    padding: 12px 30px;
    background-color: #000000;
    color: #ffffff;
    border: none;
    border-radius: 25px; 
    cursor: pointer;
    font-size: 1.1em;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    transition: background-color 0.3s ease, transform 0.2s ease;
    margin-top: 10px; 
}

button[onclick="processText()"]:hover {
    background-color: #333333;
    transform: translateY(-2px); 
}

.risultato-label {
    margin-top: 30px; 
}

#risultato {
    background-color: #f8f8f8; 
    color: #555;
    font-weight: 500;
}

.link-button-container {
    margin: 0;
    padding: 0;
    width: auto; 
}

.link-button {
    background-color: #000000; 
    color: #ffffff;
    border: none;
    border-radius: 25px;
    padding: 12px 25px;
    font-family: 'Montserrat', sans-serif;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
    text-decoration: none;
    display: inline-block;
}

.link-button:hover {
    background-color: #5a6268;
    transform: translateY(-2px);
}

@media (max-width: 480px) {
    .container {
        padding: 25px;
    }

    h1 {
        font-size: 1.8em;
    }
}
</style>


<body>
    <div class="container">
        <h1>Porta 2</h1>
        <div class="input-group">
            <label for="testo">Testo:</label>
            <textarea id="testo" placeholder="testo"></textarea>
        </div>
        <div class="input-group">
            <label for="chiave">Clavis aurea:</label>
            <input type="text" id="chiave" placeholder="Inserisci la chiave">
        </div>
        <div class="input-group">
            <label for="mode">Modalità:</label>
            <select id="mode">
                <option value="c">C</option>
                <option value="d">D</option>
            </select>
        </div>
        <button onclick="processText()">Esegui</button>
        <div class="input-group">
            <label for="risultato" class="risultato-label">Risultato:</label>
            <textarea id="risultato" readonly></textarea>
        </div>
    </div>
    <script>
function cv(testo, chiave, mode = "c") {
    testo = testo.toUpperCase();
    chiave = chiave.toUpperCase();
    let risultato = "";

    let chiave_indice = 0;
    for (let carattere of testo) {
        if (/[A-Z]/.test(carattere)) {
            let shift = chiave.charCodeAt(chiave_indice) - 'A'.charCodeAt(0);
            if (mode === "d") {
                shift = -shift;
            }

            let nuova_lettera = String.fromCharCode((carattere.charCodeAt(0) - 'A'.charCodeAt(0) + shift + 26) % 26 + 'A'.charCodeAt(0));
            risultato += nuova_lettera;

            chiave_indice = (chiave_indice + 1) % chiave.length;
        } else {
            risultato += carattere;
        }
    }

    return risultato;
}

function processText() {
    const testo = document.getElementById("testo").value;
    const chiave = document.getElementById("chiave").value;
    const mode = document.getElementById("mode").value;

    const risultato = cv(testo, chiave, mode);
    document.getElementById("risultato").value = risultato;
}


    </script>

    <div class="link-button-container">
        <a href="menu.html" class="link-button"><i class="fas fa-arrow-left"></i> Torna al Menu Principale</a>
    </div>
</body>
</html>
