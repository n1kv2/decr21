<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN?DECR2nik1v start</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<style>
body {
    font-family: 'Roboto', sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background-color: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    width: 90%;
    max-width: 400px;
    text-align: center;
}

h1 {
    margin-bottom: 20px;
    font-size: 24px;
}

p {
    margin-bottom: 20px;
    color: #555;
}

.led-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.led-red, .led-green {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: gray;
}

.led-red.active {
    background-color: red;
}

.led-green.active {
    background-color: green;
}

.input-group.password-input {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 10px;
    background-color: #f9f9f9;
}

.input-group.password-input .icon {
    margin-right: 10px;
    color: #555;
}

.input-group.password-input input {
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Roboto', sans-serif;
    font-size: 16px;
    width: 100%;
}

.link-button {
    background-color: #000000;
    color: #ffffff;
    border: none;
    border-radius: 25px;
    padding: 10px 20px;
    font-family: 'Roboto', sans-serif;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    width: 100%;
    margin-top: 20px;
}

.link-button:hover {
    background-color: #333333;
}

#warningMessage {
    margin-top: 10px;
    font-size: 14px;
}

.combination-lock {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.rotella {
    width: 50px;
    height: 50px;
    border: 2px solid #000;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
    position: relative;
}

.rotella .number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.3s ease;
}

#combinationMessage {
    margin-top: 10px;
    font-size: 14px;
}
</style>

<body>
    <div class="container">
        <h1>Benvenuto nella Geheimtür</h1>
        <p>Inserisci la password per accedere al servizio.</p>
        
        <div class="led-container">
            <div class="led-red active"></div>
            <div class="led-green"></div>
        </div>
        
        <div class="input-group password-input">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="passwordInput" placeholder="Inserisci la password">
        </div>
        
        <button id="unlockBtn" class="link-button">Sblocca accesso</button>
        
        <p id="warningMessage" style="color: red; display: none;">Il servizio è bloccato. Inserisci la password di sblocco.</p>
        
        <div id="secondStep" style="display: none;">
            <h2>Inserisci la combinazione</h2>
            <div class="combination-lock">
                <div class="rotella" data-index="0">
                    <div class="number">0</div>
                </div>
                <div class="rotella" data-index="1">
                    <div class="number">0</div>
                </div>
                <div class="rotella" data-index="2">
                    <div class="number">0</div>
                </div>
                <div class="rotella" data-index="3">
                    <div class="number">0</div>
                </div>
            </div>
            <button id="unlockCombinationBtn" class="link-button">Sblocca</button>
            <p id="combinationMessage" style="color: red; display: none;">Combinazione errata!</p>
        </div>
    </div>

    <script>
const HASHED_PASSWORD = "f8cb599d9ba7edcebd8fda08ae5d366461ee02dfdd17ae2274f079895815024a"; 
const CORRECT_COMBINATION_HASH = "edf47512eec1fbc8389dda7f4212505250ef02cc376487bdc8abefe8489cb035"; 
let isUnlocked = false;
let currentCombination = ["0", "0", "0", "0"]; 

function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    return crypto.subtle.digest('SHA-256', data).then(hash => {
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    });
}

document.getElementById('unlockBtn').addEventListener('click', async () => {
    const password = document.getElementById('passwordInput').value;
    const hashedPassword = await hashPassword(password);

    if (hashedPassword === HASHED_PASSWORD) {
        
        isUnlocked = true;
        document.querySelector('.led-red').classList.remove('active');
        document.querySelector('.led-green').classList.add('active');

        
        sessionStorage.setItem('isUnlocked', 'true');
        document.getElementById('warningMessage').style.display = 'none';
        
        
        document.getElementById('secondStep').style.display = 'block';
    } else {
        alert("Password errata!");
        document.getElementById('warningMessage').textContent = "Il servizio è bloccato. Inserisci la combinazione di sblocco.";
        document.getElementById('warningMessage').style.display = 'block';
    }
});

document.querySelectorAll('.rotella').forEach((rotella, index) => {
    rotella.addEventListener('click', () => {
        let currentNumber = parseInt(rotella.querySelector('.number').textContent);
        currentNumber = (currentNumber + 1) % 10; 
        rotella.querySelector('.number').textContent = currentNumber;
        currentCombination[index] = currentNumber.toString(); 
    });
});

document.getElementById('unlockCombinationBtn').addEventListener('click', async () => {
    const enteredCombination = currentCombination.join('');
    const hashedCombination = await hashPassword(enteredCombination); 

    if (hashedCombination === CORRECT_COMBINATION_HASH) {
        document.getElementById('combinationMessage').textContent = "Corretto! A breve ti indirizziamo nella pagina...";
        document.getElementById('combinationMessage').style.color = "green";
        document.getElementById('combinationMessage').style.display = 'block';

        
        setTimeout(() => {
            window.location.href = "menu.html";
        }, 3000);
    } else {
        document.getElementById('combinationMessage').textContent = "Combinazione errata! Riprova";
        document.getElementById('combinationMessage').style.color = "red";
        document.getElementById('combinationMessage').style.display = 'block';
    }
});
        
    </script>
</body>
</html>
