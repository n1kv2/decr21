<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <script>
        // Aggiunge la verifica di sblocco
        window.addEventListener('load', () => {
            const isUnlocked = sessionStorage.getItem('isUnlocked');
            if (isUnlocked !== 'true') {
                // Se l'accesso non è sbloccato, reindirizza alla pagina di login
                window.location.href = "index.html";
            }
        });
    </script>
</head>
<style>
body {
    font-family: 'Times New Roman', serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    background-color: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    width: 90%;
    max-width: 400px;
    text-align: center;
}

h1 {
    margin-bottom: 30px;
    font-size: 28px;
    color: #000000;
}

.button-group {
    display: flex;
    flex-direction: column;
    gap: 20px; 
}

.link-button {
    background-color: #000000;
    color: #ffffff;
    border: none;
    border-radius: 25px;
    padding: 12px 25px;
    font-family: 'Times New Roman', serif;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    text-decoration: none; 
    display: block;
    width: 100%;
    box-sizing: border-box; 
}

.link-button:hover {
    background-color: #333333;
}
</style>

<body>
    <div class="container">
        <h1>Scegli il portale</h1>
        <div class="button-group">
            <a href="code1.html" class="link-button">Sezione 1 (LNb)</a>
            <a href="code2.html" class="link-button">Sezione 2 (NLv)</a>
        </div>
    </div>
</body>
</html>
